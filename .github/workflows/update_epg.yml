name: 每日更新EPG

on:
  schedule:
    - cron: '0 22 * * *'   # 北京时间 6:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 运行脚本生成 epg.xml
        run: python generate_epg.py epg.xml

      - name: 列出当前目录文件（调试）
        run: ls -la

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"   # ← 修正这里
          git add epg.xml
          git commit -m "自动更新EPG $(date '+%Y-%m-%d %H:%M:%S')"
          git push
